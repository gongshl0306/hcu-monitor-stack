# SGLang 推理服务告警规则
#
# 指标前提：服务启动带 --enable-metrics（sglang_ 前缀指标）。
# 标签：instance（IP:端口）、model_name（--served-model-name）。

groups:
  - name: sglang-availability
    rules:
      # 服务离线（scrape 失败）
      - alert: SGLangDown
        expr: up{job="sglang"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SGLang 服务离线: {{ $labels.instance }}"
          description: "{{ $labels.instance }} ({{ $labels.model_name }}) 1 分钟无法采集 /metrics，服务可能宕机或端口不通。"

  - name: sglang-load
    rules:
      # 请求排队积压
      - alert: SGLangQueueBacklog
        expr: sglang_num_queue_reqs > 32
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SGLang 排队积压: {{ $labels.instance }}"
          description: "{{ $labels.instance }} 排队请求 {{ $value | printf \"%.0f\" }} 个持续 5 分钟，吞吐可能跟不上请求速率。"

      # 运行中请求过多（接近/超过并发能力）
      - alert: SGLangRunningReqsHigh
        expr: sglang_num_running_reqs > 128
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SGLang 并发过高: {{ $labels.instance }}"
          description: "{{ $labels.instance }} 运行中请求 {{ $value | printf \"%.0f\" }} 个持续 5 分钟，延迟可能上升。"

      # KV cache 使用率过高（>90% 会触发 retract/抢占）
      - alert: SGLangKVCacheHigh
        expr: sglang_token_usage > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SGLang KV cache 使用率过高: {{ $labels.instance }}"
          description: "{{ $labels.instance }} token_usage={{ $value | printf \"%.2f\" }}，接近上限会触发请求 retract，建议扩容或限流。"

  - name: sglang-latency
    rules:
      # TTFT（首 token 延迟）P99 过高
      - alert: SGLangTTFTHigh
        expr: histogram_quantile(0.99, sum(rate(sglang_time_to_first_token_seconds_bucket[5m])) by (le, instance)) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SGLang TTFT P99 过高: {{ $labels.instance }}"
          description: "{{ $labels.instance }} 首 token 延迟 P99 = {{ $value | printf \"%.2f\" }}s 持续 10 分钟（阈值 3s）。"

      # 端到端延迟 P99 过高
      - alert: SGLangE2ELatencyHigh
        expr: histogram_quantile(0.99, sum(rate(sglang_e2e_request_latency_seconds_bucket[5m])) by (le, instance)) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SGLang 端到端延迟 P99 过高: {{ $labels.instance }}"
          description: "{{ $labels.instance }} 请求端到端延迟 P99 = {{ $value | printf \"%.0f\" }}s 持续 10 分钟（阈值 60s）。"

  - name: sglang-errors
    rules:
      # 有请求被重退（KV cache 不足触发 retract，会重算 prefill，影响吞吐）
      - alert: SGLangRetractedRequests
        expr: sglang_num_retracted_reqs > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SGLang 有请求被重退: {{ $labels.instance }}"
          description: "{{ $labels.instance }} 当前 {{ $value | printf \"%.0f\" }} 个请求处于重退状态（KV cache 不足触发），持续 5 分钟，建议扩容或限流。"

      # 投机解码接受率过低（EAGLE 配置异常时会出现）
      - alert: SGLangSpecAcceptRateLow
        expr: sglang_spec_accept_rate < 0.3 and sglang_spec_accept_rate > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SGLang 投机解码接受率过低: {{ $labels.instance }}"
          description: "{{ $labels.instance }} spec_accept_rate={{ $value | printf \"%.2f\" }} 持续 30 分钟，投机解码收益低，可考虑关闭或调参。"
