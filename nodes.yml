# GPU 计算节点列表 —— Prometheus 采集目标（HCU exporter）
#
# 格式：targets 下每行一个 <IP>:<端口>
#   - 端口可省略，默认 16080
#   - 跨机部署：写各 GPU 节点的内网 IP（需从中心节点可达）
#   - 中心节点与某 GPU 节点同机：该行写 host.docker.internal:16080
#
# 改完本文件后，在中心节点执行：bash deploy.sh add-node  （重新生成目标并热加载）
#
# 示例（按你的实际节点 IP 修改）：
targets:
  - "10.0.0.11:16080"
  - "10.0.0.12:16080"
